<p style="margin: 0; font-family: 'Tiro Devanagari Marathi', serif; font-size: 18px; color: #8E1F5C">सस्नेह निमंत्रण</p>
<p style="margin: 0px 0 0; font-family: 'Jost', sans-serif; font-size: 10px; letter-spacing: 3px; color: #8E1F5C">A WARM INVITATION</p>
<p style="margin: 6px 0 0; font-family: 'Tiro Devanagari Marathi', serif; font-size: 16px; color: #5A3A63">आमचे येथे श्रीकृपेने</p>
<p style="margin: 0px 0 0; font-family: 'Bodoni Moda', serif; font-style: italic; font-size: 14px; line-height: 1.5; color: #6B4A73">By the grace of God</p>
<p style="margin: 10px 0 0; font-family: 'Rozha One', serif; font-size: 48px; line-height: 1.15; color: #3F1650">चि. दिव्येश</p>
<p style="margin: 0; font-family: 'Tiro Devanagari Marathi', serif; font-style: italic; font-size: 22px; color: #B8862A">आणि</p>
<p style="margin: 0; font-family: 'Rozha One', serif; font-size: 48px; line-height: 1.15; color: #3F1650"><span style="font-size: 24px">चि. सौ. कां. </span>आचल</p>
<p style="margin: 8px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -.5px; color: #8E1F5C">Divesh <span style="font-family: 'Bodoni Moda', serif; font-style: italic; font-weight: 400; color: #B8862A">&amp;</span> Achal</p>
<p style="margin: 14px 0 0; font-family: 'Tiro Devanagari Marathi', serif; font-size: 16px; line-height: 1.7; color: #4A2A55">यांचा शुभविवाह करण्याचे योजिले आहे.<br>तरी आपण सहकुटुंब उपस्थित राहून<br>वधूवरांस शुभाशीर्वाद द्यावेत, ही नम्र विनंती.</p>
<p style="margin: 10px 0 0; font-family: 'Bodoni Moda', serif; font-style: italic; font-size: 16px; line-height: 1.5; color: #5A3A63">joyfully invite you and your family<br>to grace their wedding and bless the couple.</p>

      }
      Array.prototype.slice.call(node.attributes).forEach(function(a){
        var name = a.name, val = a.value;
        if (name.indexOf('hint-') === 0) { node.removeAttribute(name); return; }
        if (val.indexOf('{{') < 0) return;
        node.removeAttribute(name);
        if (/^on[a-z]+$/.test(name)) {
          var path = whole(val), ev = name.slice(2), cur = [];
          node.addEventListener(ev, function(e){ var fn = lookup(path, cur); if (typeof fn === 'function') fn(e); });
          binds.push(function(scope){ cur = scope; });
          return;
        }
        var last;
        binds.push(function(scope){
          var w = whole(val), v = w ? lookup(w, scope) : interp(val, scope);
          var s = v == null ? '' : String(v);
          if (s !== last) { node.setAttribute(name.indexOf('dc-') === 0 ? name.slice(3) : name, s); last = s; }
        });
      });
      Array.prototype.slice.call(node.childNodes).forEach(walk);
    }
    Array.prototype.slice.call(root.childNodes).forEach(walk);
    return binds;
  }
  function instantiate(frag){
    var f = frag.cloneNode(true);
    var holder = document.createElement('div'); holder.appendChild(f);
    var binds = compile(holder);
    var out = document.createDocumentFragment(), nodes = [];
    while (holder.firstChild) { nodes.push(holder.firstChild); out.appendChild(holder.firstChild); }
    return { frag: out, nodes: nodes, update: function(scope){ binds.forEach(function(b){ b(scope); }); } };
  }
  var pending = false, comp, rootBinds, mountEl;
  function render(){ pending = false; var vals = comp.renderVals(); rootBinds.forEach(function(b){ b([vals]); }); }
  function schedule(){ if (!pending) { pending = true; (window.requestAnimationFrame || setTimeout)(render); } }
  window.DCLogic = function(props){ this.props = props || {}; this.state = {}; };
  DCLogic.prototype.setState = function(p){ if (typeof p === 'function') p = p(this.state, this.props); this.state = Object.assign({}, this.state, p); schedule(); };
  DCLogic.prototype.forceUpdate = function(){ schedule(); };
  window.__mountDC = function(Component){
    mountEl = document.getElementById('dc-root');
    var tpl = document.getElementById('dc-template');
    mountEl.appendChild(tpl.content.cloneNode(true));
    rootBinds = compile(mountEl);
    comp = new Component({});
    if (!comp.state) comp.state = {};
    render();
    if (comp.componentDidMount) comp.componentDidMount();
    fit();
    window.addEventListener('resize', fit);
  };
  function fit(){
    var card = mountEl.firstElementChild; if (!card) return;
    var w = Math.min(window.innerWidth, 440), z = w / 390;
    mountEl.style.zoom = z;
    card.style.height = Math.ceil(window.innerHeight / z) + 'px';
  }
})();
</script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { opened: false, now: Date.now(), taps: 0, particles: [] };
    this.pid = 0;
    this.timers = [];
  }
  componentDidMount() {
    this.clock = setInterval(() => this.setState({ now: Date.now() }), 1000);
  }
  componentWillUnmount() {
    clearInterval(this.clock);
    this.timers.forEach(function (t) { clearTimeout(t); });
  }
  later(fn, ms) { this.timers.push(setTimeout(fn, ms)); }
  mr(n) {
    var map = '०१२३४५६७८९';
    return String(n).replace(/[0-9]/g, function (c) { return map[+c]; });
  }
  burst(n, withFlowers) {
    var made = [];
    for (var i = 0; i < n; i++) {
      var kind = Math.random();
      var p = {
        id: ++this.pid,
        left: Math.round(Math.random() * 380),
        anim: Math.random() < 0.5 ? 'mw-fallL' : 'mw-fallR',
        dur: (3.2 + Math.random() * 2.4).toFixed(2),
        delay: (Math.random() * 1.3).toFixed(2)
      };
      var sz = Math.round(9 + Math.random() * 11);
      p.w = sz; p.h = Math.round(sz * 0.75);
      p.color = kind < 0.35 ? ['#E8862A', '#F2A03D'][Math.floor(Math.random() * 2)]
        : kind < 0.65 ? ['#F7C548', '#E9A72B'][Math.floor(Math.random() * 2)]
        : ['#C1272D', '#D9466B', '#E88AB0'][Math.floor(Math.random() * 3)];
      made.push(p);
    }
    var ids = made.map(function (m) { return m.id; });
    this.setState({ particles: this.state.particles.concat(made) });
    this.later(() => {
      this.setState({ particles: this.state.particles.filter(function (p) { return ids.indexOf(p.id) < 0; }) });
    }, 8000);
  }
  renderVals() {
    var st = this.state;
    var target = Date.UTC(2026, 11, 28, 5, 0, 0);
    var diff = Math.max(0, target - st.now);
    var s = Math.floor(diff / 1000);
    var pad = (n) => this.mr(n < 10 ? '0' + n : '' + n);
    var dots = [];
    for (var i = 0; i < 5; i++) {
      var a = (i / 5) * Math.PI * 2 - Math.PI / 2;
      var lit = i < st.taps;
      dots.push({
        x: Math.round(100 + Math.cos(a) * 86 - 11),
        y: Math.round(100 + Math.sin(a) * 86 - 11),
        fill: lit ? '#F7C548' : 'transparent',
        scale: lit ? 1.15 : 1
      });
    }
    var done = st.taps >= 5;
    return {
      units: [
        { value: this.mr(Math.floor(s / 86400)), label: 'दिवस', en: 'DAYS' },
        { value: pad(Math.floor((s % 86400) / 3600)), label: 'तास', en: 'HOURS' },
        { value: pad(Math.floor((s % 3600) / 60)), label: 'मिनिटे', en: 'MINS' },
        { value: pad(s % 60), label: 'सेकंद', en: 'SECS' }
      ],
      countdownLabel: diff > 0 ? 'लग्नाला उरलेला वेळ' : 'आज शुभविवाह!',
      countdownEn: diff > 0 ? 'COUNTDOWN TO THE WEDDING' : 'THE BIG DAY IS HERE',
      dots: dots,
      mangalDone: done,
      mangalCount: this.mr(st.taps) + '/' + this.mr(5),
      mangalBtn: done ? 'पुन्हा' : 'टॅप करा',
      mangalHint: done ? 'वधूवरांना आशीर्वाद द्या' : 'पाच मंगलाष्टकांसाठी ५ वेळा टॅप करा',
      mangalHintEn: done ? 'Bless the newlyweds' : 'Tap 5 times, once for each verse',
      mangalTap: () => {
        if (this.state.taps >= 5) { this.setState({ taps: 0 }); return; }
        var t = this.state.taps + 1;
        this.setState({ taps: t });
        if (t === 5) this.burst(46, true);
      },
      particles: st.particles,
      clothY: st.opened ? 520 : 0,
      introOpacity: st.opened ? 0 : 1,
      introVis: st.opened ? 'hidden' : 'visible',
      open: () => {
        if (this.state.opened) return;
        this.setState({ opened: true });
        this.later(() => this.burst(40, true), 1200);
      },
      sendAkshata: () => this.burst(26, false),
      shower: () => this.burst(44, true),
      reset: () => this.setState({ opened: false, taps: 0 })
    };
  }
}
window.__mountDC(Component);
</script>
